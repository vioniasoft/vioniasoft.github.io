<!-- assets/partials/nav.html -->
<nav class="nav" id="mainNav" aria-label="메인 네비게이션">
    <div class="nav-inner" id="navApp" v-cloak>
        <!-- Logo -->
        <div class="nav-logo">
            <a href="index.html">
                <img src="/assets/images/common/vioniasoft_logo.png" class="nav-logo-img" alt="VioniaSoft 비오니아소프트 서비스 대표 이미지">
            </a>
        </div>

        <!-- Mobile navigation controls -->
        <div class="mobile-nav-actions mobile-only">
            <button class="nav-toggle" type="button" @click="toggleMenu" :aria-expanded="menuOpen ? 'true' : 'false'" aria-label="Toggle navigation">
                <span></span><span></span>
            </button>
        </div>

        <!-- 菜单 -->
        <ul class="nav-menu" :class="{ open: menuOpen }">
            <li @click="go('index.html')">{{ t.nav.home }}</li>
            <li @click="go('about.html')">{{ t.nav.about }}</li>
            <li @click="go('services.html')">{{ t.nav.services }}</li>
            <li @click="go('contact.html')">{{ t.nav.contact }}</li>

            <li class="mobile-lang-section" @click.stop>
                <button class="mobile-lang-trigger" type="button" @click="langOpen = !langOpen" :aria-expanded="langOpen ? 'true' : 'false'">
                    <span class="lang-code">{{ lang.toUpperCase() }}</span>
                    <span>{{ lang === 'ko' ? '한국어' : lang === 'en' ? 'English' : lang === 'zh' ? '中文' : 'Français' }}</span>
                    <span class="lang-chevron" :class="{ open: langOpen }">⌄</span>
                </button>
                <div class="mobile-lang-options" v-if="langOpen">
                    <button type="button" @click="switchLang('ko')" :class="{ active: lang === 'ko' }">한국어</button>
                    <button type="button" @click="switchLang('en')" :class="{ active: lang === 'en' }">English</button>
                    <button type="button" @click="switchLang('zh')" :class="{ active: lang === 'zh' }">中文</button>
                    <button type="button" @click="switchLang('fr')" :class="{ active: lang === 'fr' }">Français</button>
                </div>
            </li>
        </ul>

        <!-- 指示条（桌面） -->
        <div class="nav-indicator" ref="indicator"></div>

        <!-- 桌面语言 -->
        <div class="nav-lang desktop-only" @click.stop>
            <button class="lang-btn" type="button" @click="toggleLanguage" :aria-expanded="open ? 'true' : 'false'">
                <span class="lang-code">{{ lang.toUpperCase() }}</span>
                {{ lang === 'ko' ? '한국어' : lang === 'en' ? 'English' : lang === 'zh' ? '中文' : 'Français' }}
                <span class="lang-chevron" :class="{ open: open }">⌄</span>
            </button>
            <div class="lang-dropdown" v-if="open">
                <div @click="switchLang('ko')">한국어</div>
                <div @click="switchLang('en')">English</div>
                <div @click="switchLang('zh')">中文</div>
                <div @click="switchLang('fr')">Français</div>
            </div>
        </div>
    </div>
</nav>
