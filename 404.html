<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | VioniaSoft</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #060610;
      color: #f0eeff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(ellipse 60% 40% at 50% 30%, rgba(120,80,255,0.10) 0%, transparent 50%),
        radial-gradient(ellipse 30% 30% at 80% 20%, rgba(56,213,255,0.04) 0%, transparent 50%),
        radial-gradient(ellipse 25% 25% at 15% 70%, rgba(179,92,255,0.03) 0%, transparent 50%),
        #060610;
    }

    .glow {
      position: absolute;
      width: 500px; height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(167,139,250,0.12), transparent 60%);
      filter: blur(60px);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    h1 {
      font-size: clamp(100px, 20vw, 180px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #fff 0%, #c4b5fd 40%, #a78bfa 70%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 40px rgba(167,139,250,0.35));
      margin-bottom: 16px;
    }

    h2 {
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 600;
      color: #b4b0d4;
      margin-bottom: 12px;
    }

    p {
      font-size: 14px;
      color: #7873a0;
      max-width: 420px;
      margin: 0 auto 36px;
      line-height: 1.7;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      border-radius: 12px;
      background: linear-gradient(135deg, #818cf8, #a78bfa);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 32px rgba(129,140,248,0.35);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 44px rgba(129,140,248,0.55);
    }

    .btn svg {
      transition: transform 0.3s ease;
    }

    .btn:hover svg {
      transform: translateX(3px);
    }

    .footer-text {
      position: absolute;
      bottom: 28px;
      font-size: 11px;
      color: #3d3860;
    }

    /* 2026 error experience */
    body {
      min-height: 100svh;
      height: auto;
      padding: 100px 24px 76px;
      background:
        linear-gradient(180deg, rgba(7,9,14,.38), rgba(7,9,14,.74) 68%, #07090e),
        radial-gradient(650px 500px at 40% 32%, rgba(111,118,246,.14), transparent 68%),
        url('/assets/images/backgrounds/enterprise-inner.jpg') center / cover no-repeat fixed,
        linear-gradient(180deg, #07090e, #090c13 58%, #07090e);
      color: #f7f8fb;
    }

    body::before {
      z-index: 0;
      opacity: .04;
      background:
        linear-gradient(rgba(255,255,255,.65) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.65) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(circle at 50% 42%, black, transparent 74%);
      -webkit-mask-image: radial-gradient(circle at 50% 42%, black, transparent 74%);
    }

    .brand {
      position: absolute;
      top: 30px;
      left: 34px;
      z-index: 2;
      color: #eef0f5;
      font-size: 15px;
      font-weight: 750;
      letter-spacing: -.02em;
      text-decoration: none;
    }

    .error-shell {
      position: relative;
      z-index: 1;
      width: min(720px, 100%);
      padding: 76px 38px 70px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 34px;
      background: linear-gradient(145deg, rgba(20,25,38,.76), rgba(10,14,21,.58));
      box-shadow: 0 40px 120px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .error-shell::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(110deg, rgba(111,118,246,.12), transparent 38%, rgba(155,124,247,.05));
    }

    .error-label {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 22px;
      padding: 7px 13px;
      border: 1px solid rgba(143,120,247,.24);
      border-radius: 999px;
      background: rgba(128,109,246,.085);
      color: #dccdff;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .15em;
    }

    .error-label::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #8389f8;
      box-shadow: 0 0 12px rgba(131,137,248,.55);
    }

    .glow {
      width: 560px;
      height: 360px;
      background: radial-gradient(circle, rgba(128,109,246,.2), transparent 68%);
      filter: blur(70px);
    }

    h1 {
      position: relative;
      margin-bottom: 18px;
      font-size: clamp(112px, 24vw, 210px);
      font-weight: 850;
      line-height: .78;
      letter-spacing: -.085em;
      background: linear-gradient(110deg, #fff 7%, #eef0ff 38%, #a9adff 72%, #9b7cf7);
      -webkit-background-clip: text;
      background-clip: text;
      filter: none;
    }

    h2 {
      position: relative;
      color: #f3f5f9;
      font-size: clamp(21px, 3vw, 28px);
      font-weight: 650;
      letter-spacing: -.025em;
    }

    p {
      position: relative;
      margin-bottom: 34px;
      color: #8e98aa;
      font-size: 14px;
      line-height: 1.8;
    }

    .btn {
      position: relative;
      min-height: 50px;
      padding: 0 23px;
      border-radius: 12px;
      background: linear-gradient(120deg, #6f76f6, #806df6 55%, #9b7cf7);
      color: #fff;
      font-size: 14px;
      box-shadow: 0 12px 35px rgba(0,0,0,.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(120deg, #7c84ff, #947cff 55%, #aa8dff);
      box-shadow: 0 18px 45px rgba(151,72,242,.38), 0 0 0 5px rgba(161,91,247,.08);
    }

    .footer-text {
      z-index: 2;
      width: calc(100% - 40px);
      bottom: max(22px, env(safe-area-inset-bottom));
      color: #515a6c;
      line-height: 1.5;
      white-space: normal;
    }

    @media (max-width: 600px) {
      body {
        padding: 88px 14px 68px;
        background-position: center, center, 58% center, center;
        background-attachment: scroll;
      }
      .brand { top: 25px; left: 24px; }
      .error-shell { padding: 60px 20px 56px; border-radius: 26px; }
      h1 { font-size: clamp(105px, 40vw, 160px); }
      p br { display: none; }
    }
  </style>
</head>
<body>

  <a class="brand" href="/">VioniaSoft</a>
  <div class="glow"></div>

  <main class="error-shell">
    <span class="error-label">SYSTEM NOTICE</span>
    <h1>404</h1>
    <h2>Page not found</h2>
    <p>찾고 계신 페이지가 존재하지 않거나 이동되었습니다.<br>홈페이지로 돌아가 원하시는 정보를 찾아보세요.</p>

    <a href="/" class="btn">
      Back to Home
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"/>
        <polyline points="15 6 21 12 15 18"/>
      </svg>
    </a>
  </main>

  <span class="footer-text">© 2026 VioniaSoft. All rights reserved.</span>

</body>
</html>
